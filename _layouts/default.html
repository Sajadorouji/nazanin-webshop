<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Lobster+Two:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header><div class="bar">
  <a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a {% if page.nav == 'home' %}class="on" {% endif %}href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/#menu' | relative_url }}">Menu</a>
    <a {% if page.nav == 'order' %}class="on" {% endif %}href="{{ '/order-delivery/' | relative_url }}">Order &amp; Delivery</a>
    <a {% if page.nav == 'about' %}class="on" {% endif %}href="{{ '/about/' | relative_url }}">About</a>
    <a {% if page.nav == 'contact' %}class="on" {% endif %}href="{{ '/contact/' | relative_url }}">Contact</a>
  </nav>
</div></header>

{{ content }}

{% if page.band %}{% include band.html %}{% endif %}

<footer>
  <div class="links">
    <a href="{{ site.instagram }}" target="_blank" rel="noopener">Instagram</a>
    <a href="{{ site.telegram }}" target="_blank" rel="noopener">Telegram</a>
  </div>
  <div>© {{ site.time | date: "%Y" }} {{ site.title }}</div>
</footer>
</body>
</html>
